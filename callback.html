<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip-It – TikTok connection</title>
  <style>body{font-family:system-ui,sans-serif;max-width:700px;margin:60px auto;padding:24px;line-height:1.6;color:#202124}.ok{color:#087f23}.error{color:#b00020}</style>
</head>
<body>
  <h1>Clip-It</h1>
  <p id="message">Completing TikTok connection…</p>
  <p id="details"></p>
  <script>
    const query = window.location.search || '';
    const message = document.getElementById('message');
    const details = document.getElementById('details');
    const params = new URLSearchParams(query);
    if (params.get('error')) {
      message.className = 'error';
      message.textContent = 'Returning to Clip-It after canceled authorization…';
      details.textContent = params.get('error_description') || params.get('error');
    } else if (params.get('code')) {
      message.className = 'ok';
      message.textContent = 'Returning to Clip-It…';
      details.textContent = 'If this page does not close, start the uploader again and retry login.';
    } else {
      message.textContent = 'This page is used only when TikTok redirects back to Clip-It.';
      details.textContent = 'Start the connection from the Clip-It uploader.';
    }
    if (params.get('code') || params.get('error')) {
      window.setTimeout(() => {
        window.location.replace('http://127.0.0.1:8765/callback' + query);
      }, 250);
    }
  </script>
</body>
</html>
