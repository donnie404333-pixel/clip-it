<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip-It – TikTok connection</title>
  <style>body{font-family:system-ui,sans-serif;max-width:700px;margin:60px auto;padding:24px;line-height:1.6;color:#202124}code{word-break:break-all;background:#f1f3f4;padding:2px 5px;border-radius:4px}.ok{color:#087f23}.error{color:#b00020}</style>
</head>
<body>
  <h1>Clip-It</h1>
  <p id="message">Completing TikTok connection…</p>
  <p id="details"></p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const message = document.getElementById('message');
    const details = document.getElementById('details');
    const error = params.get('error');
    const code = params.get('code');

    if (error) {
      message.className = 'error';
      message.textContent = 'TikTok authorization was not completed.';
      details.textContent = params.get('error_description') || error;
    } else if (code) {
      message.className = 'ok';
      message.textContent = 'TikTok authorization was received.';
      details.innerHTML = 'Return to the Clip-It uploader to finish connecting your account. Do not share the authorization code or this URL with anyone.';
    } else {
      message.textContent = 'This page is used only when TikTok redirects back to Clip-It.';
      details.textContent = 'Start the connection from the Clip-It uploader.';
    }
  </script>
</body>
</html>
